<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Aura_Deen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c10;  
    --bg-deep:   #131f4a;
    --surface:   rgba(24, 28, 32, .55);
    --surface2:  rgba(34, 40, 44, .5);
    --glass-blur-sm: blur(10px) saturate(160%);
    --glass-blur: blur(20px) saturate(180%);
    --glass-blur-lg: blur(34px) saturate(200%);
    --glass-highlight: inset 0 1px 0 rgba(255,255,255,.09);
    --border:    rgba(255,255,255,.14); 
    --border-strong: rgba(143,191,131,.5);
    --text:       #e8ebe4;  
    --muted:     #6d726c;
    --sub:       #a2a8a0;
    --accent:    #8fbf83;
    --accent2:   #e8b84b;
    --accent3: #3d5a80;
--accent3-glow: rgba(61,90,128,.35);
    --user-bub:  #223244;
    --user-text: #e2eef5;
    --bot-bub:   #171b1f;  
    --radius-lg: 28px;   /* était 20px */
    --radius-md: 23px;   /* était 14px */
    --radius-sm: 16px;   /* était 9px */;
    --font-display: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --tracking-tight: -.01em;
    --tracking-wide: .05em;
    --font:      'Inter', -apple-system, 'Segoe UI', sans-serif;
    --font-ar:   'Amiri', serif;
    --ease-out:  cubic-bezier(.16,1,.3,1);
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --shadow: 0 10px 34px -10px rgba(0,0,0,.4), 0 2px 10px -3px rgba(0,0,0,.28);
    --shadow-sm: 0 2px 10px -3px rgba(0,0,0,.4);
    --gold-gradient: linear-gradient(135deg, #f5dd9a 0%, #e8b84b 42%, #b8862f 75%, #8a6a2c 100%);
    --gold-gradient-soft: linear-gradient(135deg, rgba(245,221,154,.16), rgba(184,134,47,.10));
    --shadow-lux: 0 16px 44px -14px rgba(0,0,0,.55), 0 4px 16px -4px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  }

  /* ===== Glassmorphism global ===== */
  .bubble.bot, .verse-card, .name-card, .tuto-card, .stat-box,
  .audiobar, .input-wrap, .result-card, .sourate-item, .welcome-logo {
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
  }
  .tool-btn, .chip, .quick-link, .topbar-icon, .theme-menu-item {
    -webkit-backdrop-filter: var(--glass-blur-sm);
    backdrop-filter: var(--glass-blur-sm);
  }
  .menu-panel, .theme-menu, .drawer {
    -webkit-backdrop-filter: var(--glass-blur-lg);
    backdrop-filter: var(--glass-blur-lg);
  }
  .bubble.bot, .verse-card, .menu-panel, .theme-menu, .name-card, .tuto-card, .stat-box, .audiobar, .input-wrap {
    box-shadow: var(--glass-highlight), var(--shadow-sm);
  }
  .tool-btn, .chip, .quick-link, .topbar-icon {
    transition: transform .18s var(--ease-spring), border-color .25s var(--ease-out), background .25s var(--ease-out), box-shadow .25s var(--ease-out) !important;
  }
  .tool-btn:active, .chip:active, .quick-link:active, .topbar-icon:active, .send-btn:active, .verse-play:active {
    transform: scale(.92) !important;
  }
  .send-btn.active {
    box-shadow: 0 4px 18px -4px rgba(143,191,131,.55), var(--glass-highlight);
  }
  .verse-card:hover, .quick-link:hover {
    box-shadow: var(--glass-highlight), 0 8px 24px -8px rgba(0,0,0,.35);
  }
  html, body {
  height: 100%;
  height: 100dvh;
  background: linear-gradient(180deg, #1a0508 0%, #0a0306 38%, #050204 68%, #000000 100%);
  color: var(--text);
  font-family: var(--font);
  overflow: hidden;
}
  
  ::selection { background: rgba(232,184,75,.3); color: var(--text); }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 760px; margin: 0 auto; position: relative; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 58px; flex-shrink: 0;
    background: linear-gradient(to bottom, var(--bg) 65%, transparent); backdrop-filter: blur(6px); position: relative; z-index: 10; }
  .topbar-icon { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
    border: 1px solid var(--border); color: var(--sub); cursor: pointer; background: var(--surface);
    transition: border-color .3s var(--ease-out), color .3s var(--ease-out), background .3s var(--ease-out), transform .35s var(--ease-spring); }
  .topbar-icon svg { width: 15px; height: 15px; }
  .topbar-icon:hover { border-color: var(--accent); color: var(--text); background: var(--surface2); transform: translateY(-1px); }
  .topbar-title { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 17.5px; font-weight: 700; letter-spacing: .7px;
    background: var(--gold-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .topbar-title .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 6px var(--accent2); animation: pulseDot 2.4s ease-in-out infinite; }
  @keyframes pulseDot { 0%,100%{opacity:.85; transform:scale(1)} 50%{opacity:.4; transform:scale(.85)} }
  .meander { height: 1px; flex-shrink: 0; opacity: .7; background-image: linear-gradient(90deg, transparent, rgba(232,184,75,.55) 20%, rgba(232,184,75,.55) 80%, transparent); }
  .topbar-icon.accent3-active { border-color: var(--accent3); color: #a8c2e0; background: rgba(61,90,128,.12); }
  .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease-out); z-index: 30; }
  .menu-overlay.open { opacity: 1; pointer-events: auto; }
  .menu-panel { position: fixed; top: 0; left: 0; bottom: 0; width: 300px; max-width: 86vw; background: var(--surface); border-right: 1px solid var(--border);
    box-shadow: var(--shadow); transform: translateX(-100%); transition: transform .38s var(--ease-out); z-index: 31; display: flex; flex-direction: column; padding: 16px; }
  .menu-panel.open { transform: translateX(0); }
  .menu-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-family: var(--font-display); font-size: 15px; }
  .menu-close { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--sub);
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .25s var(--ease-out); }
  .menu-close:hover { border-color: var(--accent); color: var(--text); transform: rotate(90deg); }
  .menu-close svg { width: 13px; height: 13px; }
  .menu-search { width: 100%; padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); font-size: 13px; margin-bottom: 10px; font-family: var(--font); }
  .menu-search:focus { outline: none; border-color: var(--accent); }
  .menu-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .sourate-item { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: var(--radius-sm); cursor: pointer; transition: background .18s var(--ease-out); }
  .sourate-item:hover { background: var(--surface2); }
  .s-num { font-family: var(--font-display); font-size: 11px; color: var(--muted); width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .s-meta { flex: 1; min-width: 0; }
  .s-meta .translit { font-size: 13.5px; color: var(--text); }
  .s-meta .translation { font-size: 11px; color: var(--muted); }
  .s-arabic { font-family: var(--font-ar); font-size: 16px; color: var(--accent2); }

  .chat { flex: 1; overflow-y: auto; padding: 18px 20px 8px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
  .chat::-webkit-scrollbar { width: 5px; }
  .chat::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #e8b84b, #8a6a2c); border-radius: 4px; }

  .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 58vh; text-align: center; gap: 10px; animation: fadeUp .5s var(--ease-out); }
  .welcome-logo { width: 60px; height: 60px; border-radius: 50%; background: var(--surface); border: 1px solid transparent;
    background-clip: padding-box; position: relative;
    display: flex; align-items: center; justify-content: center; margin-bottom: 10px; box-shadow: var(--shadow-lux), 0 0 40px rgba(232,184,75,.18);
    animation: glow 4s ease-in-out infinite, float 5s ease-in-out infinite; }
  .welcome-logo::before { content: ''; position: absolute; inset: -1px; border-radius: 50%; padding: 1px;
    background: var(--gold-gradient); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity: .8; }
  .welcome-logo svg { width: 30px; height: 30px; }
  @keyframes glow { 0%,100%{box-shadow:0 0 30px rgba(143,191,131,.12)} 50%{box-shadow:0 0 46px rgba(232,184,75,.22)} }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .welcome h1 { font-family: var(--font-display); font-size: 27px; font-weight: 600; letter-spacing: var(--tracking-tight); line-height: 1.25; }
  .welcome p { font-size: 13.5px; color: var(--sub); max-width: 320px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; max-width: 480px; }
  .chip { padding: 9px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--sub); font-size: 13px; cursor: pointer;
    transition: border-color .25s var(--ease-out), color .25s var(--ease-out), background .25s var(--ease-out), transform .25s var(--ease-spring); }
  .chip:hover { border-color: #e8b84b; color: var(--text); background: var(--gold-gradient-soft); transform: translateY(-2px); box-shadow: 0 6px 18px -6px rgba(232,184,75,.35); }

  @keyframes fadeUp { from{opacity:0;transform:translateY(12px) scale(.985)} to{opacity:1;transform:translateY(0) scale(1)} }
  .msg-row { display: flex; gap: 10px; margin: 12px 0; animation: fadeUp .4s var(--ease-out); }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); font-size: 13px; font-weight: 600; }
  .avatar.user { background: var(--user-bub); color: var(--user-text); }
  .avatar.bot { background: var(--surface); }
  .avatar.bot svg { width: 17px; height: 17px; }
  .bubble { max-width: 78%; padding: 11px 14px; border-radius: var(--radius-md); font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .bubble.user { background: var(--user-bub); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bot-col { max-width: 88%; display: flex; flex-direction: column; gap: 8px; }
  .bubble.bot { background: var(--bot-bub); border-bottom-left-radius: 4px; border: 1px solid var(--border); }

  .typing { display: flex; gap: 4px; padding: 3px 2px; }
  .typing .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sub); animation: bounce 1.2s infinite; }
  .typing .dot:nth-child(2) { animation-delay: .15s; } .typing .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.5} 30%{transform:translateY(-4px);opacity:1} }

  .verse-card { position: relative; overflow: hidden; border: 1px solid var(--border); border-top: 1px solid rgba(232,184,75,.4); border-radius: var(--radius-sm); padding: 13px 15px;
    background: rgba(255,255,255,.02); box-shadow: var(--shadow-lux); transition: box-shadow .25s var(--ease-out), transform .25s var(--ease-out); }
  .verse-card::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.07) 0%, transparent 30%); }
  .verse-card:active { transform: scale(.985); }
  .verse-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .verse-card.card-quran { border-left: 2px solid var(--accent); }
  .verse-card.card-quran:hover { box-shadow: var(--shadow-lux), 0 0 26px -8px rgba(143,191,131,.35); }
  .verse-card.card-hadith { border-left: 2px solid var(--accent2); }
  .verse-card.card-hadith:hover { box-shadow: var(--shadow-lux), 0 0 26px -8px rgba(232,184,75,.35); }
  .verse-card.card-dua { border-left: 2px solid var(--accent3); }
  .verse-card.card-dua:hover { box-shadow: var(--shadow-lux), 0 0 26px -8px rgba(61,90,128,.4); }
  .verse-ref { font-size: 11px; color: var(--accent2); letter-spacing: .3px; }
  .verse-play { background: none; border: 1px solid var(--border); color: var(--sub); width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: .15s; flex-shrink: 0; }
  .verse-play:hover { border-color: var(--accent); color: var(--accent); }
  .verse-actions { display: flex; align-items: center; gap: 4px; }
.verse-icon-btn { background: none; border: 1px solid var(--border); color: var(--sub); width: 26px; height: 26px; border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center; transition: .15s; flex-shrink: 0; }
.verse-icon-btn svg { width: 12px; height: 12px; }
.verse-icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.verse-icon-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(232,184,75,.15); }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px); background: var(--surface);
  border: 1px solid var(--border-strong); color: var(--text); padding: 10px 18px; border-radius: 20px; font-size: 13px;
  box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .25s var(--ease-out), transform .25s var(--ease-out); z-index: 70; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .verse-play svg { width: 11px; height: 11px; }
  .verse-ar { font-family: var(--font-ar); font-size: 21px; line-height: 1.9; text-align: right; direction: rtl; color: var(--text); }
  .verse-translit { font-size: 12.5px; font-style: italic; color: var(--muted); margin-top: 6px; }
  .verse-fr { font-size: 13.5px; margin-top: 5px; color: var(--sub); }
  .verse-link { font-size: 12px; color: var(--accent); cursor: pointer; margin-top: 4px; display: inline-block; }
  .verse-link:hover { text-decoration: underline; }

  .bottom { flex-shrink: 0; padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); position: relative; }
  .scroll-bottom-btn { position: absolute; right: 22px; top: -46px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); color: var(--sub); display: flex; align-items: center; justify-content: center; cursor: pointer;
    opacity: 0; pointer-events: none; transform: translateY(6px); transition: all .25s var(--ease-out); box-shadow: var(--shadow-sm); }
  .scroll-bottom-btn.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .scroll-bottom-btn svg { width: 15px; height: 15px; }
  .input-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 8px 8px 6px; transition: border-color .25s var(--ease-out); }
  .input-wrap:focus-within { border-color: var(--border-strong); }
  .input-row { display: flex; align-items: flex-end; gap: 8px; padding: 2px 6px; }
  #msg { flex: 1; resize: none; background: transparent; border: none; color: var(--text); font-family: var(--font); font-size: 14.5px;
    line-height: 1.4; max-height: 140px; padding: 8px 4px; }
  #msg:focus { outline: none; }
  #msg::placeholder { color: var(--muted); }
  .send-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--surface2); color: var(--muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all .25s var(--ease-out); }
  .send-btn svg { width: 16px; height: 16px; }
  .send-btn.active { background: var(--gold-gradient); color: #12140f; box-shadow: 0 4px 16px -4px rgba(232,184,75,.55); }
  .tools { display: flex; align-items: center; gap: 6px; padding: 4px 4px 2px; flex-wrap: wrap; }
  .tool-btn { display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--sub); font-size: 12px; cursor: pointer; transition: all .2s var(--ease-out); font-family: var(--font); position: relative; }
  .tool-btn svg { width: 12px; height: 12px; }
  .tool-btn:hover { border-color: #e8b84b; color: var(--text); background: var(--gold-gradient-soft); }
  .tool-btn.active-menu { border-color: var(--accent2); color: var(--text); }
  .theme-menu { position: absolute; bottom: calc(100% + 10px); left: 0; width: min(280px, 86vw); background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: 7px; z-index: 20;
    opacity: 0; transform: translateY(8px) scale(.97); pointer-events: none; transform-origin: bottom left;
    transition: opacity .22s var(--ease-out), transform .22s var(--ease-spring); }
  .theme-menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .theme-menu-item { display: block; width: 100%; text-align: left; padding: 8px 9px; border-radius: var(--radius-sm); border: none;
    background: transparent; color: var(--sub); font-size: 13px; font-family: var(--font); cursor: pointer; transition: background .18s var(--ease-out), color .18s var(--ease-out); }
  .theme-menu-item:hover { background: var(--surface2); color: var(--text); }
  .quiz-score { font-size: 11px; color: var(--accent2); margin-bottom: 6px; }
.quiz-question { font-size: 13.5px; margin-bottom: 6px; }
.quiz-verse { font-size: 14px; font-style: italic; color: var(--sub); margin-bottom: 10px; }
.quiz-options { display: flex; flex-wrap: wrap; gap: 8px; }
.quiz-option { padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 13px; cursor: pointer; transition: .2s; }
.quiz-option:hover:not(:disabled) { border-color: var(--accent); }
.quiz-option.correct { border-color: #7cc576; background: rgba(124,197,118,.15); color: #b7e8b0; }
.quiz-option.wrong { border-color: #e07a6a; background: rgba(224,122,106,.15); color: #f0a99c; }
.quiz-option:disabled { cursor: default; opacity: .8; }
  .model-badge { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; }

  .audiobar { position: fixed; left: 50%; transform: translateX(-50%) translateY(120%); bottom: 0; width: min(760px, 100%); background: var(--surface);
    border-top: 1px solid var(--border); padding: 9px 16px calc(9px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px;
    transition: transform .3s var(--ease-out); z-index: 25; }
  .audiobar.show { transform: translateX(-50%) translateY(0); }
  .audiobar .info { font-size: 11.5px; color: var(--sub); min-width: 120px; }
  .audiobar audio { flex: 1; height: 30px; }
  .repeat-btn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface2);
    color: var(--sub); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .repeat-btn svg { width: 13px; height: 13px; }
  .repeat-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(232,184,75,.15); }
  .repeat-btn { position: relative; }
  .repeat-badge { position: absolute; top: -5px; right: -5px; background: var(--accent2); color: #12140f; font-size: 8.5px; font-weight: 700;
    width: 14px; height: 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

  .now-playing-overlay { position: fixed; inset: 0; background: rgba(4,5,8,.82); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
    z-index: 60; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .3s var(--ease-out); }
  .now-playing-overlay.open { opacity: 1; pointer-events: auto; }
  .np-panel { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 28px; max-width: 380px; width: 90%; text-align: center; position: relative;
    background: var(--surface); border: 1px solid rgba(232,184,75,.4); border-radius: var(--radius-lg); box-shadow: var(--shadow-lux, var(--shadow)), 0 0 40px rgba(232,184,75,.1); }
  .np-close { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface2); color: var(--sub); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .np-close svg { width: 14px; height: 14px; }
  .np-title { font-family: var(--font-display); font-size: 16px; line-height: 1.4; padding: 0 6px; }

.glow {
  position: fixed;
  width: 480px;
  height: 480px;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(95px);
  opacity: .28;
  z-index: 0;
  background: radial-gradient(circle, var(--accent), transparent);
  top: 12%;
  left: 30%;
  transform: translateX(-50%);
  animation: drift 9s ease-in-out infinite alternate;
}
@keyframes drift {
  from { transform: translate(-55%, 0) scale(1); }
  to   { transform: translate(-35%, 4%) scale(1.25); }
}

.glow2 {
  position: fixed;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(115px);
  opacity: .32;
  z-index: 0;
  background: radial-gradient(circle, var(--accent2), transparent);
  bottom: -8%;
  right: 10%;
  transform: translateX(-50%);
  animation: drift2 12s ease-in-out infinite alternate;
}
@keyframes drift2 {
  from { transform: translate(-58%, 0) scale(1); }
  to   { transform: translate(-38%, -6%) scale(1.22); }
}

.glow3 {
  position: fixed;
  width: 440px;
  height: 440px;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(110px);
  opacity: .22;
  z-index: 0;
  background: radial-gradient(circle, var(--accent3), transparent);
  top: 45%;
  left: 70%;
  transform: translateX(-50%);
  animation: drift3 15s ease-in-out infinite alternate;
}
@keyframes drift3 {
  from { transform: translate(-50%, 0) scale(1); }
  to   { transform: translate(-65%, -8%) scale(1.18); }
}

.glow4 {

  width: 360px;
  height: 360px;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(90px);
  opacity: .2;
  z-index: 0;

  top: 68%;
  left: 18%;

}
@keyframes drift4 {

async function loadData() {
  const [chapRes, quranRes, frRes, translitRes] = await Promise.all([
    fetch(`${DATA_BASE}/chapter.json`).then(r => r.json()),
    fetch(`${DATA_BASE}/quran.json`).then(r => r.json()),
    fetch(`${DATA_BASE}/fr.json`).then(r => r.json()),
    fetch(`${DATA_BASE}/transliteration.json`).then(r => r.json()),
  ]);
  chapters = chapRes; quran = quranRes; fr = frRes; translit = translitRes;
  chapters.forEach(ch => {
    const verses = quran[ch.id] || [];
    verses.forEach((v, i) => {
      flatVerses.push({
        chapter: ch.id, verse: v.verse, ar: v.text,
        fr: fr[ch.id]?.[i]?.text || '', translit: translit[ch.id]?.[i]?.text || '',
        chapterMeta: ch
      });
    });
  });
  dataReady = true;
  renderSidebarList(chapters);
}
let hadiths = null;
let hadithSections = null;
let hadithsLoading = null;

  

function stripAccents(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

function renderSidebarList(list) {
  const el = document.getElementById('sourateListEl');
  if (!el) return;
  el.innerHTML = list.map(ch => `
    <div class="sourate-item" onclick="openReader(${ch.id})">
      <div class="s-num">${ch.id}</div>
      <div class="s-meta"><div class="translit">${ch.transliteration}</div><div class="translation">${ch.translation} · ${ch.total_verses} v.</div></div>
      <div class="s-arabic">${ch.name}</div>
    </div>`).join('');
}
function filterSourateList(q) {
  q = stripAccents((q || '').toLowerCase());
  if (!q) { renderSidebarList(chapters); return; }
  renderSidebarList(chapters.filter(ch =>
    stripAccents(ch.transliteration.toLowerCase()).includes(q) ||
    stripAccents(ch.translation.toLowerCase()).includes(q) ||
    String(ch.id) === q
  ));
}

const HADITH_COLLECTIONS = {
  muslim:   { file: 'hadith-muslim.json', label: 'Sahih Muslim', keywords: ['muslim'] },
bukhari:  { file: 'bukhari.json', label: 'Sahih Al-Bukhari', keywords: ['bukhari', 'boukhari', 'boukari'] },
abudawud: { file: 'abudawud.json', label: 'Sunan Abou Dawoud', keywords: ['abu dawud', 'abou dawoud', 'abudawud', 'aboudaoud'] },
ibnmajah: { file: 'ibnmajah.json', label: 'Sunan Ibn Majah', keywords: ['ibn majah', 'ibnmajah'] },
malik:    { file: 'malik.json', label: 'Al-Muwatta de Malik', keywords: ['malik', 'mouwatta', 'muwatta'] },
nasai:    { file: 'nasai.json', label: "Sunan An-Nasa'i", keywords: ['nasai', 'nassai'] },
nawawi:   { file: 'nawawi.json', label: 'Les 40 hadiths d’An-Nawawi', keywords: ['nawawi'] },
qudsi:    { file: 'qudsi.json', label: 'Les 40 hadiths Qudsi', keywords: ['qudsi'] },
dehlawi:  { file: 'dehlawi.json', label: 'Les 40 hadiths d’Ad-Dehlawi', keywords: ['dehlawi'] }};

const hadithCache = {};
const hadithLoadingPromises = {};
async function ensureCollectionLoaded(id) {
  if (hadithCache[id]) return hadithCache[id];
  if (!hadithLoadingPromises[id]) {
    const info = HADITH_COLLECTIONS[id];
    hadithLoadingPromises[id] = fetch(`${DATA_BASE}/${info.file}`)
      .then(r => { if (!r.ok) throw new Error('fichier introuvable (' + r.status + ')'); return r.json(); })
      .then(data => {
        hadithCache[id] = { hadiths: data.hadiths, sections: data.metadata.sections };
        return hadithCache[id];
      })
      .catch(err => { delete hadithLoadingPromises[id]; throw err; });
  }
  return hadithLoadingPromises[id];
}

function detectHadithCollection(tl) {
  for (const [id, info] of Object.entries(HADITH_COLLECTIONS)) {
    if (info.keywords.some(k => tl.includes(k))) return id;
  }
  return null;
}

const HADITH_BOOK_SYNONYMS = {
  1: ['foi', 'iman', 'croyance'], 2: ['purification', 'ablution', 'wudu'], 4: ['priere', 'salat'],
  11: ['funerailles', 'mort', 'defunt', 'janaza'], 12: ['zakat', 'aumone', 'charite'],
  13: ['jeune', 'ramadan', 'siyam'], 15: ['pelerinage', 'hajj', 'omra'], 16: ['mariage', 'nikah'],
  18: ['divorce', 'talaq'], 32: ['jihad'], 36: ['boisson', 'boissons', 'alcool'],
  37: ['vetements', 'habits'], 38: ['manieres', 'comportement', 'adab'], 43: ['vertus', 'merites'],
  46: ['destin', 'qadar', 'predestination'], 47: ['science', 'savoir', 'connaissance', 'ilm'],
  48: ['invocation', 'dhikr', 'doua', 'repentir', 'istighfar'], 52: ['jour du jugement', 'jugement dernier', 'qiyama'],
  53: ['paradis', 'jannah'], 56: ['coran', 'tafsir', 'commentaire du coran']
};
function findHadithBookId(tl, sections) {
  for (const [id, synonyms] of Object.entries(HADITH_BOOK_SYNONYMS)) {
    if (synonyms.some(syn => tl.includes(syn)) && sections[id]) return parseInt(id);
  }
  const numMatch = tl.match(/livre\s*(\d+)|chapitre\s*(\d+)/);
  if (numMatch) {
    const id = parseInt(numMatch[1] || numMatch[2]);
    if (sections[id]) return id;
  }
  return null;
}

function searchHadithsIn(pool, query, limit, bookId) {
  limit = limit || 3;
  let filtered = pool;
  if (bookId !== null && bookId !== undefined) filtered = filtered.filter(h => h.reference && h.reference.book === bookId);
  const qTokens = tokenize(query);
  if (qTokens.length === 0) return filtered.slice(0, limit);
  const scored = filtered.map(h => {
    const hTokens = tokenize(h.text);
    let score = 0;
    qTokens.forEach(qt => hTokens.forEach(ht => {
      if (ht === qt) score += 3; else if (ht.includes(qt) || qt.includes(ht)) score += 1;
    }));
    return { h, score };
  }).filter(r => r.score > 0);
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, limit).map(r => r.h);
  
  
}

/* ================= SIGNETS / FAVORIS / COPIER / PARTAGER ================= */
const BOOKMARKS_KEY = 'aura_deen_bookmarks';
function loadBookmarks() {
  try { return JSON.parse(localStorage.getItem(BOOKMARKS_KEY)) || []; } catch (e) { return []; }
}
let bookmarks = loadBookmarks();
function saveBookmarks() { localStorage.setItem(BOOKMARKS_KEY, JSON.stringify(bookmarks)); }
function isBookmarked(id) { return bookmarks.some(b => b.id === id); }

function escapeAttr(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function cardActionsHTML(item) {
  const active = isBookmarked(item.id) ? 'active' : '';
  const attrs = `data-type="${item.type}" data-id="${escapeAttr(item.id)}"
    data-chapter="${item.chapter || ''}" data-verse="${item.verse || ''}"
    data-collection="${item.collectionId || ''}" data-hadithnum="${item.hadithnumber || ''}"
    data-ar="${escapeAttr(item.ar || '')}" data-translit="${escapeAttr(item.translit || '')}"
    data-fr="${escapeAttr(item.fr || '')}" data-ref="${escapeAttr(item.ref || '')}"`;
  return `
    <button class="verse-icon-btn ${active}" ${attrs} onclick="handleBookmarkClick(this)" title="Favori">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
    </button>
    <button class="verse-icon-btn" ${attrs} onclick="handleCopyClick(this)" title="Copier">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
    </button>
    <button class="verse-icon-btn" ${attrs} onclick="handleShareClick(this)" title="Partager">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 3.9M15.4 6.6l-6.8 3.9"/></svg>
    </button>`;
}

function itemFromBtn(btn) {
  const d = btn.dataset;
  return {
    type: d.type, id: d.id,
    chapter: d.chapter ? parseInt(d.chapter) : null,
    verse: d.verse ? parseInt(d.verse) : null,
    collectionId: d.collection || null,
    hadithnumber: d.hadithnum ? parseInt(d.hadithnum) : null,
    ar: d.ar, translit: d.translit, fr: d.fr, ref: d.ref
  };
}
function buildShareText(item) {
  return item.type === 'verse'
    ? `${item.ar}\n\n${item.fr}\n\n— ${item.ref} · Aura · Deen`
    : `${item.fr}\n\n— ${item.ref} · Aura · Deen`;
}
function handleBookmarkClick(btn) {
  const item = itemFromBtn(btn);
  const idx = bookmarks.findIndex(b => b.id === item.id);
  if (idx >= 0) { bookmarks.splice(idx, 1); toastMessage('Retiré des favoris'); }
  else { bookmarks.unshift({ ...item, dateAdded: new Date().toISOString(), category: 'Général' }); toastMessage('Ajouté aux favoris ⭐'); }
  saveBookmarks();
  document.querySelectorAll(`[data-id="${CSS.escape(item.id)}"][title="Favori"]`).forEach(b => b.classList.toggle('active', isBookmarked(item.id)));
}
function handleCopyClick(btn) { copyText(buildShareText(itemFromBtn(btn))); }
function handleShareClick(btn) {
  const item = itemFromBtn(btn);
  shareText(buildShareText(item), item.ref);
}

  closeMenu();

  document.getElementById('chatView').classList.add('hide');

  document.getElementById('hadithView').classList.remove('show');
  document.getElementById('duaView').classList.remove('show');
  document.getElementById('profileView').classList.remove('show');
  document.getElementById('precheView').classList.remove('show');
  document.getElementById('settingsView').classList.remove('show');
  document.getElementById('aboutView').classList.remove('show');
  document.getElementById('namesView').classList.remove('show');
  document.getElementById('revisionsView').classList.remove('show');
  document.getElementById('bookmarksView').classList.add('show');
  document.getElementById('bottomBar').classList.add('hide');
  renderBookmarksView();
}

const READING_PROGRESS_KEY = 'aura_deen_reading_progress';
function loadReadingProgress() {
  try {
    const raw = localStorage.getItem(READING_PROGRESS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { readVerses: [], lastRead: null };
}
let readingProgress = loadReadingProgress();
function saveReadingProgress() { localStorage.setItem(READING_PROGRESS_KEY, JSON.stringify(readingProgress)); }

function markVerseRead(chapter, verse) {
  const id = `${chapter}-${verse}`;
  if (!readingProgress.readVerses.includes(id)) {
    readingProgress.readVerses.push(id);
    bumpDailyGoal('versesRead', 1);
  }
  readingProgress.lastRead = { chapter, verse, timestamp: Date.now() };
  saveReadingProgress();
}
function totalQuranVerses() {
  return chapters.reduce((sum, c) => sum + c.total_verses, 0);
}
function globalProgressPercent() {
  const total = totalQuranVerses();
  return total ? Math.round((readingProgress.readVerses.length / total) * 100) : 0;
}
function sourateProgress(chapterId) {
  const ch = chapters.find(c => c.id === chapterId);
  if (!ch) return { read: 0, total: 0, percent: 0 };
  const read = readingProgress.readVerses.filter(id => id.startsWith(`${chapterId}-`)).length;
  return { read, total: ch.total_verses, percent: ch.total_verses ? Math.round((read / ch.total_verses) * 100) : 0 };
}

let readingObserver = null;
function setupReadingObserver() {
  if (readingObserver) readingObserver.disconnect();
  readingObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const chapter = parseInt(entry.target.dataset.chapter);
        const verse = parseInt(entry.target.dataset.verse);
        markVerseRead(chapter, verse);
        updateSourateProgressBar(chapter);
      }
    });
  }, { threshold: 0.6 });
  document.querySelectorAll('.reader-verse').forEach(el => readingObserver.observe(el));
}
function updateSourateProgressBar(chapterId) {
  const p = sourateProgress(chapterId);
  const bar = document.getElementById('sourateProgressBar');
  const label = document.getElementById('sourateProgressLabel');
  if (bar) bar.style.width = p.percent + '%';
  if (label) label.textContent = `${p.read} / ${p.total} versets lus`;
}
function resumeReading() {
  if (!readingProgress.lastRead) { toastMessage('Aucune lecture en cours'); return; }
  const { chapter, verse } = readingProgress.lastRead;
  showReaderView();
  renderReader(chapter);
  setTimeout(() => {
    const card = document.querySelector(`.reader-verse[data-chapter="${chapter}"][data-verse="${verse}"]`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 150);
}

/* ================= MÉMORISATION (méthode 20/20) ================= */
const MEMORIZATION_KEY = 'aura_deen_memorization';
function loadMemorization() {
  try { return JSON.parse(localStorage.getItem(MEMORIZATION_KEY)) || {}; } catch (e) { return {}; }
}
let memorization = loadMemorization();
function saveMemorization() { localStorage.setItem(MEMORIZATION_KEY, JSON.stringify(memorization)); }

const MEMO_LEVELS = { new: '🔴 Nouveau', learning: '🟠 En apprentissage', consolidation: '🟡 Consolidation', mastered: '🟢 Maîtrisé' };

let memoSession = null;

function openMemorizePicker(chapter, verse) {
  const ch = chapters.find(c => c.id === chapter);
  const maxLen = ch.total_verses - verse + 1;
  const options = [1, 2, 3, 5].filter(n => n <= maxLen);
  document.getElementById('nowPlayingOverlay')?.classList.remove('open');
  const overlay = document.createElement('div');
  overlay.className = 'now-playing-overlay open';
  overlay.id = 'memoPickerOverlay';
  overlay.innerHTML = `
    <div class="np-panel" style="gap:14px;">
      <button class="np-close" onclick="document.getElementById('memoPickerOverlay').remove()" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="np-title" style="margin-top:20px;">🧠 Mémoriser à partir de ${ch.transliteration} ${verse}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
        ${options.map(n => `<button class="tool-btn" onclick="startMemoSession(${chapter}, ${verse}, ${verse + n - 1})">${n} verset${n > 1 ? 's' : ''}</button>`).join('')}
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function startMemoSession(chapter, verseStart, verseEnd) {
  document.getElementById('memoPickerOverlay')?.remove();
  const ch = chapters.find(c => c.id === chapter);
  const versesArr = quran[chapter] || [];
  const passage = [];
  for (let v = verseStart; v <= verseEnd; v++) {
    const idx = versesArr.findIndex(x => x.verse === v);
    if (idx >= 0) passage.push({
      chapter, verse: v, ar: versesArr[idx].text,
      translit: translit[chapter]?.[idx]?.text || '', fr: fr[chapter]?.[idx]?.text || ''
    });
  }
  memoSession = { chapter, verseStart, verseEnd, chapterMeta: ch, passage, phase: 'read', count: 0, readTarget: 20, reciteTarget: 20, textHidden: false, isReview: false, passageId: null };
  renderMemoSession();
}

function memoPassageId() {
  return `${memoSession.chapter}-${memoSession.verseStart}-${memoSession.verseEnd}`;
}

function renderMemoSession() {
  showChatView();
  document.getElementById('bottomBar').classList.add('hide');
  let overlay = document.getElementById('memoSessionOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'memoSessionOverlay';
    overlay.className = 'now-playing-overlay open';
    document.body.appendChild(overlay);
  }
  const s = memoSession;
  const isRead = s.phase === 'read';
  const target = isRead ? s.readTarget : s.reciteTarget;
  const passageArText = s.passage.map(v => v.ar).join(' ');
  const passageFrText = s.passage.map(v => v.fr).join(' ');

  overlay.innerHTML = `
    <div class="np-panel" style="max-width:420px;">
      <button class="np-close" onclick="closeMemoSession()" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="np-title" style="margin-top:18px;">${s.isReview ? '🔁 Révision' : (isRead ? '📖 Lecture' : '🧠 Récitation')} — ${s.chapterMeta.transliteration} ${s.verseStart}${s.verseEnd > s.verseStart ? '-' + s.verseEnd : ''}</div>
      <div class="goals-count" style="font-size:14px;">${s.count} / ${target}</div>
      <div class="progress-track" style="width:260px;"><div class="progress-fill" style="width:${(s.count / target) * 100}%"></div></div>
      <div class="verse-card" style="width:100%;text-align:right;min-height:80px;display:flex;align-items:center;justify-content:center;">
        ${(!isRead && s.textHidden)
          ? `<button class="tool-btn" onclick="memoRevealText()">👁 Vérifier le texte</button>`
          : `<div style="width:100%;"><div class="verse-ar">${passageArText}</div><div class="verse-fr" style="margin-top:8px;">${passageFrText}</div></div>`}
      </div>
      <div class="np-controls" style="flex-direction:column;gap:10px;width:100%;">
        ${isRead
          ? `<button class="tool-btn" style="width:100%;" onclick="playMemoPassageAudio()">🔊 Écouter le passage</button>
             <button class="np-btn" style="width:100%;border-radius:24px;" onclick="memoAdvance()">J'ai lu ✓</button>`
          : `<button class="np-btn" style="width:100%;border-radius:24px;" onclick="memoAdvance()">Je me souviens ✓</button>`}
      </div>
    </div>`;
}

function playMemoPassageAudio() {
  const s = memoSession;
  if (!s) return;
  playMemoVerseSeq(s.chapter, s.verseStart, s.verseEnd);
}
function playMemoVerseSeq(chapter, verse, endVerse) {
  const player = document.getElementById('player');
  const ch = chapters.find(c => c.id === chapter);
  player.src = `${AUDIO_BASE}/${pad3(chapter)}/${pad3(verse)}.mp3`;
  document.getElementById('audioInfo').textContent = `${ch.transliteration} · v.${verse}`;
  document.getElementById('audiobar').classList.add('show');
  player.play().catch(() => {});
  player.onended = () => {
    if (verse < endVerse) playMemoVerseSeq(chapter, verse + 1, endVerse);
  };
}

function memoRevealText() {
  memoSession.textHidden = false;
  renderMemoSession();
}

function memoAdvance() {
  const s = memoSession;
  s.count++;
  if (s.phase === 'read' && s.count >= s.readTarget) {
    s.phase = 'recite'; s.count = 0; s.textHidden = true;
  } else if (s.phase === 'recite' && s.count >= s.reciteTarget) {
    finishMemoSession();
    return;
  } else if (s.phase === 'recite') {
    s.textHidden = true;
  }
  renderMemoSession();
}

function stageConfig(stage) {
  const table = [
    { delayMs: 4 * 60 * 60 * 1000, readCount: 3, reciteCount: 3 },
    { delayMs: 24 * 60 * 60 * 1000, readCount: 5, reciteCount: 5 },
    { delayMs: 24 * 60 * 60 * 1000, readCount: 0, reciteCount: 1 }
  ];
  if (stage < table.length) return table[stage];
  const regularIdx = stage - table.length;
  const intervalsDays = [3, 7, 14, 30, 60];
  const days = intervalsDays[Math.min(regularIdx, intervalsDays.length - 1)];
  return { delayMs: days * 24 * 60 * 60 * 1000, readCount: 0, reciteCount: 1 };
}
function levelForStage(stage) {
  if (stage === 0) return 'new';
  if (stage === 1) return 'learning';
  if (stage === 2) return 'consolidation';
  const regularIdx = stage - 3;
  return regularIdx >= 3 ? 'mastered' : 'consolidation';
}

function finishMemoSession() {
  const s = memoSession;
  const now = Date.now();
  if (s.isReview) {
    const m = memorization[s.passageId];
    if (!m) { document.getElementById('memoSessionOverlay')?.remove(); memoSession = null; return; }
    const nextStage = m.reviewStage + 1;
    const cfg = stageConfig(nextStage);
    memorization[s.passageId] = {
      ...m, reviewStage: nextStage, level: levelForStage(nextStage), nextReview: now + cfg.delayMs,
      reviewHistory: [...(m.reviewHistory || []), now]
    };
    saveMemorization();
    document.getElementById('memoSessionOverlay')?.remove();
    memoSession = null;
    toastMessage('✅ Révision effectuée !');
    if (memoQueue && memoQueue.length) { setTimeout(runNextInMemoQueue, 400); }
    else if (currentView === 'revisions') { renderRevisionsView(); }
  } else {
    const id = memoPassageId();
    memorization[id] = {
      chapter: s.chapter, verseStart: s.verseStart, verseEnd: s.verseEnd,
      level: levelForStage(0), dateAdded: memorization[id]?.dateAdded || now,
      reviewStage: 0, nextReview: now + stageConfig(0).delayMs,
      reviewHistory: [...(memorization[id]?.reviewHistory || []), now]
    };
    saveMemorization();
    document.getElementById('memoSessionOverlay')?.remove();
    memoSession = null;
    toastMessage('🎉 Passage mémorisé ! Prochaine révision plus tard aujourd\u2019hui.');
  }
}

function closeMemoSession() {
  document.getElementById('memoSessionOverlay')?.remove();
  memoSession = null;
}

/* ---- Révisions : session à partir d'un passage déjà mémorisé ---- */
function startReviewSession(passageId) {
  const m = memorization[passageId];
  if (!m) return;
  const cfg = stageConfig(m.reviewStage);
  const versesArr = quran[m.chapter] || [];
  const passage = [];
  for (let v = m.verseStart; v <= m.verseEnd; v++) {
    const idx = versesArr.findIndex(x => x.verse === v);
    if (idx >= 0) passage.push({
      chapter: m.chapter, verse: v, ar: versesArr[idx].text,
      translit: translit[m.chapter]?.[idx]?.text || '', fr: fr[m.chapter]?.[idx]?.text || ''
    });
  }
  const ch = chapters.find(c => c.id === m.chapter);
  memoSession = {
    chapter: m.chapter, verseStart: m.verseStart, verseEnd: m.verseEnd, chapterMeta: ch, passage,
    phase: cfg.readCount > 0 ? 'read' : 'recite', count: 0,
    readTarget: cfg.readCount, reciteTarget: cfg.reciteCount,
    textHidden: cfg.readCount === 0, isReview: true, passageId
  };
  renderMemoSession();
}

let memoQueue = null;
function startCombinedReview() {
  const due = dueMemorizationEntries();
  if (due.length === 0) { toastMessage('Rien à réviser pour le moment 🎉'); return; }
  memoQueue = due.map(([id]) => id);
  runNextInMemoQueue();
}
function runNextInMemoQueue() {
  if (!memoQueue || memoQueue.length === 0) { memoQueue = null; toastMessage('🎉 Révisions du jour terminées !'); if (currentView === 'revisions') renderRevisionsView(); return; }
  const id = memoQueue.shift();
  startReviewSession(id);
}

function dueMemorizationEntries() {
  const now = Date.now();
  return Object.entries(memorization).filter(([, m]) => m.nextReview <= now).sort((a, b) => a[1].nextReview - b[1].nextReview);
}
function memoEntryRef(m) {
  const ch = chapters.find(c => c.id === m.chapter);
  const label = ch ? ch.transliteration : `Sourate ${m.chapter}`;
  return `${label} ${m.verseStart}${m.verseEnd > m.verseStart ? '-' + m.verseEnd : ''}`;
}

function loadMemoGoalTargets() {

function reviewsCompletedToday() {

function openBookmark(id) {

function copyText(text) {
  const done = () => toastMessage('Copié ✓');
  if (navigator.clipboard?.writeText) { navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done)); }
  else { fallbackCopy(text, done); }
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) {}
  document.body.removeChild(ta);
}
function shareText(text, title) {
  if (navigator.share) { navigator.share({ title: title || 'Aura · Deen', text }).catch(() => {}); }
  else { copyText(text); }
}
let toastTimeout = null;
function toastMessage(msg) {
  let el = document.getElementById('toastEl');
  if (!el) {
    el = document.createElement('div');

    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 1800);
}

let duas = null;
let duasLoadingPromise = null;
let duaCategories = [];
let duaActiveCategory = null;
async function ensureDuasLoaded() {
  if (duas) return duas;
  if (!duasLoadingPromise) {
    duasLoadingPromise = Promise.all([
      fetch(`${DATA_BASE}/invocations.json`).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch(`${DATA_BASE}/dua.json`).then(r => r.ok ? r.json() : null).catch(() => null)
    ]).then(([invocData, oldData]) => {
      const fromInvocations = (invocData?.duas || []).map(d => ({
        category: d.category, title: d.title, arabic: d.arabic, transliteration: d.transliteration, french: d.french,
        sourceLabel: d.source ? `${d.source.collection || ''}${d.source.reference ? ' · ' + d.source.reference : ''}` : '',
        audioSrc: d.audio ? encodeAudioPath(`${AUDIO_BASE}/invocations/${d.audio}`) : null
      }));
      const fromOld = (Array.isArray(oldData) ? oldData : []).map(d => ({
        category: 'classiques', title: d.count_description || `Invocation n°${d.order}`, arabic: d.content,
        transliteration: d.transliteration, french: d.translation,
        sourceLabel: [d.fadl, d.source].filter(Boolean).join(' · '),
        audioSrc: encodeAudioPath(`${AUDIO_BASE}/duas/${d.order}.mp3`)
      }));
      duas = [...fromInvocations, ...fromOld];
      duaCategories = [...new Set(duas.map(d => d.category).filter(Boolean))];
      if (duas.length === 0) throw new Error('aucune invocation trouvée (ni invocations.json ni dua.json)');
      return duas;
    }).catch(err => { duasLoadingPromise = null; throw err; });
  }
  return duasLoadingPromise;
}

function duaCategoryLabel(cat) {
  return (cat || '').replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
}

function duaCardHTML(d) {
  return `
    <div class="verse-card card-dua">
      <div class="verse-top">
        <span class="verse-ref">${duaCategoryLabel(d.category)}${d.title ? ' · ' + d.title : ''}</span>
        ${d.audioSrc ? `<button class="verse-play" onclick="playDuaAudio('${d.audioSrc}', '${(d.title || '').replace(/'/g, "\\'")}')" title="Écouter"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>` : ''}
      </div>
      <div class="verse-ar">${d.arabic}</div>
      <div class="verse-translit">${d.transliteration}</div>
      <div class="verse-fr">${d.french}</div>
      ${d.sourceLabel ? `<div class="verse-fr" style="margin-top:6px;font-size:11.5px;color:var(--muted);">${d.sourceLabel}</div>` : ''}
    </div>`;
}

function duaPillHTML(d) {
  const idx = duas.indexOf(d);
  const label = `${duaCategoryLabel(d.category)}${d.title ? ' · ' + d.title : ''}`;
  return `<button class="chip dua-pill" onclick="openDuaDetail(${idx})">${label}</button>`;

function renderDuaList(filterText) {
  const listEl = document.getElementById('duaListEl');
  if (!listEl) return;
  const q = stripAccents((filterText || '').toLowerCase());
  const filtered = duas.filter(d => {
    const matchCat = !duaActiveCategory || d.category === duaActiveCategory;
    const matchText = !q || stripAccents((d.title || '').toLowerCase()).includes(q) || stripAccents((d.french || '').toLowerCase()).includes(q);
    return matchCat && matchText;
  });
  listEl.innerHTML = filtered.length ? `<div class="dua-pill-wrap">${filtered.map(duaPillHTML).join('')}</div>`
    : `<p style="font-size:12.5px;color:var(--muted);text-align:center;margin-top:20px;">Aucune invocation trouvée.</p>`;
}

  duaActiveCategory = cat;
  document.querySelectorAll('.dua-chip').forEach(el => el.classList.toggle('active', el.dataset.cat === (cat || '')));
  renderDuaList(document.getElementById('duaSearch').value);
}

function encodeAudioPath(path) {
  return path.split('/').map(encodeURIComponent).join('/');
}

function resolveAudioSrc(p) {
  return p.url ? encodeURI(p.url) : encodeAudioPath(`${AUDIO_BASE}/preches/${p.file}`);
}

function playPrecheAudio(p) {
  const player = document.getElementById('player');
  player.src = resolveAudioSrc(p);
  document.getElementById('audioInfo').textContent = p.title;
  document.getElementById('audiobar').classList.add('show');
  player.play().catch(() => {});
}

function playPrecheByIndex(idx) {
  const p = PRECHES[idx];
  if (p) playPrecheAudio(p);
}

function precheCardHTML(p) {
  const idx = PRECHES.indexOf(p);
  const label = p.part ? `${p.category} · partie ${p.part}` : p.category;
  return `
    <div class="verse-card card-hadith">
      <div class="verse-top">
        <span class="verse-ref">${label}</span>
        <button class="verse-play" onclick="playPrecheByIndex(${idx})" title="Écouter">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
      <div class="verse-fr" style="font-size:14.5px;color:var(--text);">${p.title}</div>
    </div>`;
}

function precheCategories() {
  return [...new Set(PRECHES.map(p => p.category))];
}

let precheActiveCategory = null;
function renderPrecheList(filterText) {
  const listEl = document.getElementById('precheList');
  if (!listEl) return;
  const q = stripAccents((filterText || '').toLowerCase());
  const filtered = PRECHES.filter(p => {
    const matchCat = !precheActiveCategory || p.category === precheActiveCategory;
    const matchText = !q || stripAccents(p.title.toLowerCase()).includes(q) || stripAccents(p.category.toLowerCase()).includes(q);
    return matchCat && matchText;
  });
  listEl.innerHTML = filtered.length
    ? filtered.map(precheCardHTML).join('')
    : `<p style="font-size:12.5px;color:var(--muted);text-align:center;margin-top:20px;">Aucun prêche trouvé.</p>`;
}

function setPrecheCategory(cat) {
  precheActiveCategory = cat;
  document.querySelectorAll('.preche-chip').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === (cat || ''));
  });
  renderPrecheList(document.getElementById('precheSearch').value);
}

const SETTINGS_KEY = 'aura_deen_settings';
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) return Object.assign(defaultSettings(), JSON.parse(raw));
  } catch (e) {}
  return defaultSettings();
}
function defaultSettings() {
  return { textSize: 'md', font: 'sans', reduceMotion: false, hideTranslit: false, playFrenchAudio: false, userColor: '#e8b84b', colorRatio: 0 };
}
let appSettings = loadSettings();
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(appSettings)); } catch (e) {} }

function applySettings() {
  document.body.classList.remove('text-sm', 'text-md', 'text-lg', 'text-xl');
  document.body.classList.add('text-' + appSettings.textSize);
  document.body.classList.toggle('font-serif', appSettings.font === 'serif');
  document.body.classList.toggle('reduce-motion', appSettings.reduceMotion);
  document.body.classList.toggle('hide-translit', appSettings.hideTranslit);
  const overlay = document.getElementById('userColorOverlay');
  overlay.style.background = appSettings.userColor;
  overlay.style.opacity = (appSettings.colorRatio / 100).toString();
}

function updateSetting(key, value) {
  appSettings[key] = value;
  saveSettings();
  applySettings();
  if (currentView === 'settings') openSettingsView();
}

function confirmResetSettings() {
  if (confirm('Réinitialiser tous les réglages d\'apparence par défaut ?')) {
    appSettings = defaultSettings();
    saveSettings();
    applySettings();
    openSettingsView();
  }
}

const REPEAT_OPTIONS = [0, 1, 5, 10, 20];
let repeatIndex = 0;
let repeatCount = 0;
let repeatsRemaining = 0;
function toggleRepeat() {
  repeatIndex = (repeatIndex + 1) % REPEAT_OPTIONS.length;
  repeatCount = REPEAT_OPTIONS[repeatIndex];
  const btn = document.getElementById('repeatBtn');
  btn.classList.toggle('active', repeatCount > 0);
  btn.title = repeatCount > 0 ? `Répéter ${repeatCount}x` : 'Répéter';
  let badge = btn.querySelector('.repeat-badge');
  if (repeatCount > 0) {
    if (!badge) { badge = document.createElement('span'); badge.className = 'repeat-badge'; btn.appendChild(badge); }
    badge.textContent = repeatCount;
  } else if (badge) {
    badge.remove();

function playVerse(chapter, verse, forceContinuous) {
  const player = document.getElementById('player');
  const ch = chapters.find(c => c.id === chapter);
  document.querySelectorAll('.reader-verse').forEach(c => c.classList.remove('playing'));
  const card = document.querySelector(`.reader-verse[data-chapter="${chapter}"][data-verse="${verse}"]`);

  document.getElementById('audioInfo').textContent = `${ch.transliteration} · v.${verse}`;
  document.getElementById('audiobar').classList.add('show');
  if (forceContinuous) continuous = true;
  repeatsRemaining = repeatCount;
  player.play().catch(() => {});
  player.onended = () => {
    if (repeatCount > 0 && repeatsRemaining > 0) {
      repeatsRemaining--;
      player.currentTime = 0; player.play().catch(() => {});

const STOPWORDS = new Set(['le', 'la','les','de','des','du','un','une','et','en','que','qui','sur','dans','par','pour','avec','ce','ces','est','sont','a','au','aux','se','sa','son','ses','ne','pas','plus','ou','il','elle','ils','elles','a','d','l','qu','comment','pourquoi','quoi','dis','moi','peux','tu','me','parle','parler','sais','savoir']);
function tokenize(str) {
  return stripAccents(str.toLowerCase()).replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(t => t.length > 2 && !STOPWORDS.has(t));
}
function searchVerses(query, limit) {
  limit = limit || 4;
  const qTokens = tokenize(query);
  if (qTokens.length === 0) return [];
  const scored = flatVerses.map(v => {
    const vTokens = tokenize(v.fr + ' ' + v.chapterMeta.translation);
    let score = 0;
    qTokens.forEach(qt => vTokens.forEach(vt => {
      if (vt === qt) score += 3; else if (vt.includes(qt) || qt.includes(vt)) score += 1;
    }));
    return { v, score };
  }).filter(r => r.score > 0);
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, limit).map(r => r.v);
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1]
        ? dp[i - 1][j - 1]
        : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}

function findChapterByName(query) {
  const q = stripAccents(query.toLowerCase()).replace(/-/g, ' ');

  // 1. Synonymes / surnoms connus
  for (const [id, synonyms] of Object.entries(SOURATE_SYNONYMS)) {
    if (synonyms.some(syn => q.includes(stripAccents(syn)))) {
      return chapters.find(ch => ch.id === parseInt(id));
    }
  }

  // 2. Correspondance exacte / mot-inclus (comportement d'origine)
  let found = chapters.find(ch => {
    const translit = stripAccents(ch.transliteration.toLowerCase()).replace(/-/g, ' ');
    const translation = stripAccents(ch.translation.toLowerCase());
    const words = translit.split(' ').filter(w => w.length > 1);
    const allFound = words.every(w => q.includes(w) || q.includes(w.replace(/h$/, '')));
    return allFound || q.includes(translation);
  });
  if (found) return found;

  // 3. Tolérance aux fautes de frappe (Levenshtein) sur chaque mot de la question
  const queryWords = q.split(' ').filter(w => w.length > 3);
  let bestMatch = null, bestScore = Infinity;
  for (const ch of chapters) {
    const translit = stripAccents(ch.transliteration.toLowerCase()).replace(/-/g, ' ');
    for (const qw of queryWords) {
      for (const cw of translit.split(' ')) {
  if (cw.length < 3) continue;
  if (Math.abs(qw.length - cw.length) > 3) continue; // mots trop différents en longueur, inutile de comparer
  const dist = levenshtein(qw, cw);
  const tolerance = Math.floor(cw.length / 3);
  if (dist <= tolerance && dist < bestScore) {
    bestScore = dist; bestMatch = ch;
  }

      }
    }
  }
  return bestMatch;
}

function importAllData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const backup = JSON.parse(reader.result);
      if (!backup || !backup.data) throw new Error('format invalide');
      if (!confirm('Remplacer tes données actuelles par celles de cette sauvegarde ? Cette action est irréversible.')) return;
      Object.entries(backup.data).forEach(([key, value]) => {
        if (BACKUP_KEYS.includes(key)) localStorage.setItem(key, value);
      });
      toastMessage('Sauvegarde restaurée ✓');
      setTimeout(() => location.reload(), 800);
    } catch (e) {
      toastMessage('Fichier de sauvegarde invalide');
    }
  };
  reader.readAsText(file);
}

  if (stats.lastVisit === today) return;
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);

function respond(rawText) {
  const t = rawText.trim();
  const tl = stripAccents(t.toLowerCase());

  if (/(qui es[- ]tu|c'est quoi aura|presente[- ]toi|tu es qui|identité|identity|qui es tu|decris toi|décris toi|presentation|presentation|c'est qui aura|c qui aura|t'es qui|tes qui)/i.test(tl)) {
    // Choisir aléatoirement entre les trois versions
    const identities = [IDENTITY, IDENTITY_SHORT, IDENTITY_WARM];
    return { type: 'text', text: fillName(pick(identities)) };
  }
  if (/\bhadith\b|\bhadiths\b/.test(tl)) return { type: 'hadith_query', query: t };
  if (/\bpreche\b|\bpreches\b|\bsermon\b|\bsermons\b|\bkhoutba\b|\bkhutba\b/.test(tl)) return { type: 'preche_query', query: t };
  if (/\b(jeu|game|jouer|quiz)\b/.test(tl)) return { type: 'game' };

  for (const rule of RESPOND_THEME_RULES) {
    if (rule.pattern.test(tl)) return { type: 'text', text: fillName(pick(rule.responses)) };
  }

  let m = tl.match(/sourate\s*(\d{1,3}).{0,15}verset\s*(\d{1,3})/) || tl.match(/verset\s*(\d{1,3}).{0,15}sourate\s*(\d{1,3})/) || t.match(/\b(\d{1,3})\s*[:\/]\s*(\d{1,3})\b/);
  if (m) {
    const c = parseInt(m[1]), vNum = parseInt(m[2]);
    const v = flatVerses.find(x => x.chapter === c && x.verse === vNum);
    if (v) return { type: 'verses', intro: `Voici le verset demandé :`, verses: [v], showLink: true, autoplay: wantsAutoplay(tl) };
    return { type: 'text', text: `Je ne trouve pas la sourate ${c} verset ${vNum}. Vérifie les numéros et réessaie.` };
  }
  m = tl.match(/sourate\s*(\d{1,3})\b/) || tl.match(/\b(\d{1,3})\b/);
  let chapter = null;
  if (m) chapter = chapters.find(c => c.id === parseInt(m[1]));
  if (!chapter) chapter = findChapterByName(tl);

  if (chapter) {
    if (wantsCount(tl)) {
      return { type: 'text', text: `La sourate ${chapter.transliteration} (${chapter.name}) contient ${chapter.total_verses} versets.` };
    }
    if (/mecquoise|medinoise|type de sourate/.test(tl)) {
      return { type: 'text', text: `${chapter.transliteration} est une sourate ${chapter.type === 'meccan' ? 'mecquoise' : 'médinoise'}.` };
    }

    let targetVerseNum = null;
    if (/dernier verset/.test(tl)) targetVerseNum = chapter.total_verses;
    else if (/premier verset/.test(tl)) targetVerseNum = 1;
    else if (/verset du milieu|milieu/.test(tl)) targetVerseNum = Math.ceil(chapter.total_verses / 2);
    else {
      const numMatch = tl.match(/(\d{1,3})\s*(?:e|eme|ieme)?\s*verset|verset\s*(\d{1,3})/);
      if (numMatch) targetVerseNum = parseInt(numMatch[1] || numMatch[2]);
    }

    if (targetVerseNum) {
      const v = flatVerses.find(x => x.chapter === chapter.id && x.verse === targetVerseNum);
      if (v) return { type: 'verses', intro: `Voici le verset ${targetVerseNum} de ${chapter.transliteration} :`, verses: [v], showLink: true, autoplay: wantsAutoplay(tl) };
      return { type: 'text', text: `La sourate ${chapter.transliteration} n'a que ${chapter.total_verses} versets, il n'y a pas de verset ${targetVerseNum}.` };
    }

    const versesArr = quran[chapter.id] || [];
    const preview = versesArr.slice(0, 2).map((v, i) => ({
      chapter: chapter.id, verse: v.verse, ar: v.text,
      fr: fr[chapter.id]?.[i]?.text || '', translit: translit[chapter.id]?.[i]?.text || '', chapterMeta: chapter
    }));
    return {
      type: 'verses',
      intro: `**${chapter.transliteration}** (${chapter.name}) — « ${chapter.translation} » · ${chapter.type === 'meccan' ? 'mecquoise' : 'médinoise'} · ${chapter.total_verses} versets.\nVoici les premiers versets :`,
      verses: preview, showLink: true
    };
  }

  const results = searchVerses(t, 4);
  if (results.length > 0) {
    return { type: 'verses', intro: `Voici ce que le Coran dit à propos de « ${t} » :`, verses: results, showLink: true };
  }

  return { type: 'text', text: ` Je n’ai rien trouvé pour « ${t} ». Essaie avec un mot-clé plus simple, comme un thème, un nom de sourate ou une référence (ex. « Recite le verset 2:255 »). 
Que souhaitez-vous découvrir aujourd’hui ? 😊` };

}

const quizState = { score: 0, total: 0, correctChapter: null };

function pickQuizVerse() {
  const pool = flatVerses.filter(v => v.fr && v.fr.length > 20 && v.fr.length < 160);
  return pool[Math.floor(Math.random() * pool.length)];
}
function buildQuizOptions(correctChapter) {
  const options = [correctChapter];
  while (options.length < 4) {
    const c = chapters[Math.floor(Math.random() * chapters.length)];
    if (!options.find(o => o.id === c.id)) options.push(c);
  }
  return options.sort(() => Math.random() - 0.5);
}
function renderQuizCard() {
  const verse = pickQuizVerse();
  quizState.correctChapter = verse.chapterMeta;
  const options = buildQuizOptions(verse.chapterMeta);
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  const col = document.createElement('div');
  col.className = 'bot-col';
  col.innerHTML = `
    <div class="bubble bot">
      <div class="quiz-score">Score : ${quizState.score} / ${quizState.total}</div>
      <div class="quiz-question">De quelle sourate vient ce verset ?</div>
      <div class="quiz-verse">« ${verse.fr} »</div>
      <div class="quiz-options" id="quizOptions">
        ${options.map(o => `<button class="quiz-option" onclick="answerQuiz(${o.id})" data-id="${o.id}">${o.transliteration}</button>`).join('')}
      </div>
    </div>`;
  row.innerHTML = `<div class="avatar bot">${botAvatarSVG()}</div>`;
  row.appendChild(col);
  chatEl.appendChild(row);
  scrollDown(true);
}
function answerQuiz(chosenId) {
  const options = document.querySelectorAll('#quizOptions .quiz-option');
  const correct = quizState.correctChapter.id;
  quizState.total++;
  if (chosenId === correct) quizState.score++;
  options.forEach(btn => {
    btn.disabled = true;
    const id = parseInt(btn.dataset.id);
    if (id === correct) btn.classList.add('correct');
    else if (id === chosenId) btn.classList.add('wrong');
  });
  setTimeout(() => {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `<div class="avatar bot">${botAvatarSVG()}</div><div class="bubble bot">${chosenId === correct ? '✅ Exact !' : `❌ La bonne réponse était ${quizState.correctChapter.transliteration}.`}<br><button class="tool-btn" style="margin-top:8px" onclick="renderQuizCard()">Question suivante ▶</button></div>`;
    chatEl.appendChild(row);
    scrollDown(true);
  }, 400);
}
function startQuizGame() {
  quizState.score = 0; quizState.total = 0;
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `<div class="avatar bot">${botAvatarSVG()}</div><div class="bubble bot">?? C'est parti ! Je te montre un verset, à toi de deviner la sourate.</div>`;
  chatEl.appendChild(row);
  scrollDown(true);
  renderQuizCard();
}

function typeWriter(el, rawText, speed) {
  speed = speed || 4;     // ms entre chaque groupe de lettres — plus petit = plus rapide
  const chunkSize = 3;    // nombre de lettres révélées à chaque tick — plus grand = plus rapide
  let i = 0;
  function tick() {
    i += chunkSize;
    el.innerHTML = escapeHTML(rawText.slice(0, i));
    if (i < rawText.length) {
      setTimeout(tick, speed);
      scrollDown();
    } else {
      scrollDown(true);
    }
  }
  tick();
}

  if (result.type === 'text') {

    col.appendChild(bubbleEl);
    row.appendChild(col);
    chatEl.appendChild(row);
    typeWriter(bubbleEl, result.text, 4);
  } else {
    const cardsHTML = result.type === 'verses_html' ? result.cardsHTML : result.verses.map(v => verseCardHTML(v, { showLink: result.showLink })).join('');
    col.innerHTML = `<div class="bubble bot">${escapeHTML(result.intro).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')}</div>${cardsHTML}`;
    row.appendChild(col);
    chatEl.appendChild(row);
    scrollDown(true);
  }

}

async function sendMessage() {
  const el = document.getElementById('msg');
  const text = el.value.trim();
  if (!text) return;
  el.value = ''; autoResize(el); toggleSend();
  addUserBubble(text);
  stats.totalMessages++;
  const statsTheme = detectStatsTheme(stripAccents(text.toLowerCase()));
  if (statsTheme) stats.themeCounts[statsTheme] = (stats.themeCounts[statsTheme] || 0) + 1;
  saveStats();
  showTyping();
  if (!dataReady) { await loadData().catch(() => {}); }
  await new Promise(r => setTimeout(r, 420 + Math.random() * 350));
  hideTyping();
  const result = respond(text);
if (result.type === 'hadith_query') {
  const tl = stripAccents(text.toLowerCase());
  const collectionId = detectHadithCollection(tl) || 'muslim';
  const collectionLabel = HADITH_COLLECTIONS[collectionId].label;
  let coll;
  try {
    coll = await ensureCollectionLoaded(collectionId);
  } catch (err) {
    addBotResult({ type: 'text', text: `Je n'arrive pas à charger ${collectionLabel} pour le moment. Vérifie que data/${HADITH_COLLECTIONS[collectionId].file} est bien en ligne.` });
    return;
  }
  const numMatch = tl.match(/hadith\s*(?:numero|numéro|n)?\s*(\d+)/);
  if (numMatch) {
    const h = coll.hadiths.find(x => x.hadithnumber === parseInt(numMatch[1]));
    if (h) { addBotResult({ type: 'verses_html', intro: `Voici le hadith n°${h.hadithnumber} (${collectionLabel}) :`, cardsHTML: hadithCardHTML(h, collectionLabel) }); stats.hadithsShown++; saveStats(); bumpDailyGoal('hadithsRead', 1); }
    else addBotResult({ type: 'text', text: `Je ne trouve pas le hadith n°${numMatch[1]} dans ${collectionLabel}.` });
  } else {
    const bookId = findHadithBookId(tl, coll.sections);
    const wantsAll = /\btous\b|\btoutes\b|\bliste\b|\bl'ensemble\b/.test(tl);
    const limit = wantsAll ? 20 : 3;
    const results = searchHadithsIn(coll.hadiths, result.query, limit, bookId);
    if (results.length > 0) {
      const bookLabel = bookId !== null ? ` (${coll.sections[bookId]})` : '';
      addBotResult({ type: 'verses_html', intro: `Voici ce que rapporte ${collectionLabel}${bookLabel} à ce sujet :`, cardsHTML: results.map(h => hadithCardHTML(h, collectionLabel)).join('') });
      stats.hadithsShown += results.length; saveStats();
      bumpDailyGoal('hadithsRead', 1);
    } else {
      addBotResult({ type: 'text', text: `Je n'ai rien trouvé dans ${collectionLabel} pour « ${result.query} ».` });
    }
  }

} else if (result.type === 'preche_query') {
  const q = result.query.replace(/\bpreche(s)?\b|\bsermon(s)?\b|\bkhoutba\b|\bkhutba\b/gi, '').trim();
  const tl2 = stripAccents(q.toLowerCase());
  const matches = q
    ? PRECHES.filter(p => stripAccents(p.title.toLowerCase()).includes(tl2) || stripAccents(p.category.toLowerCase()).includes(tl2))
    : [];
  if (matches.length > 0) {
    addBotResult({ type: 'verses_html', intro: `Voici ce que j'ai trouvé parmi les prêches :`, cardsHTML: matches.slice(0, 5).map(precheCardHTML).join('') });
  } else {
    addBotResult({ type: 'text', text: `Je n'ai rien trouvé de précis. Touche l'icône 🎙️ dans la barre du haut pour parcourir les ${PRECHES.length} prêches par thème.` });
  }
} else if (result.type === 'game') { startQuizGame(); } else {
  addBotResult(result);
  if (result.type === 'verses' && result.verses) { stats.versesShown += result.verses.length; saveStats(); }
  if (result.autoplay && result.verses && result.verses[0]) {
    const v0 = result.verses[0];
    playVerse(v0.chapter, v0.verse);
  }
}
}
function startNewChat() {
  chatEl.innerHTML = `<div class="welcome" id="welcome"><div class="welcome-logo">${botAvatarSVG()}</div>
    <h1 id="welcomeTitle">Que veux-tu apprendre du Coran aujourd'hui ?</h1>
    <p>Read, reflect, and discover the guidance of the Quran.</p>
    <div id="dailyGoalsWidget" style="width:100%;max-width:340px;"></div>
    <div class="chips" id="welcomeChips"></div></div>`;
  refreshWelcomeTitle();
  renderChips();
  renderDailyGoalsWidget();
  renderHomeTodaySummary();
}
function scrollDown(force) { if (force || isNearBottom()) chatEl.scrollTop = chatEl.scrollHeight; updateScrollBottomBtn(); }
function isNearBottom() { return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 120; }
function handleChatScroll() { updateScrollBottomBtn(); }
function updateScrollBottomBtn() { document.getElementById('scrollBottomBtn').classList.toggle('visible', !isNearBottom()); }

'🎧 Ad-Duhâ 93:5',  '🎧Ghâfir 40:60',

 '🎧 Al-Kahf 18:10', '🎧Luqman 31:17', 
 


];

}
function quickAsk(text) {
  closeThemeMenu();
  closePopularMenu();
  document.getElementById('msg').value = text;
  sendMessage();
}

loadData().then(() => renderChips()).catch(err => {
  chatEl.innerHTML = `<div class="welcome"><h1>Erreur de chargement</h1><p>${err.message}<br>Une erreur inattendue s'est produite veuillez réactualiser la page</p></div>`;
});
toggleSend();
refreshWelcomeTitle();
renderDailyGoalsWidget();
renderHomeTodaySummary();
updateStreakOnLoad();
applySettings();
new Audio(`${AUDIO_BASE}/start.mp3`).play().catch(() => {});



let deferredInstallPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('installBtn').style.display = 'flex';
});

function triggerInstall() {
  if (!deferredInstallPrompt) {
    // iOS ou navigateur qui ne supporte pas l'installation automatique
    alert('Sur iPhone/iPad : touche l\'icône de partage dans Safari, puis "Sur l\'écran d\'accueil".\n\nSur Android/Chrome : cherche "Installer l\'application" dans le menu ⋮ du navigateur.');
    return;
  }
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then((choice) => {
    if (choice.outcome === 'accepted') {
      document.getElementById('installBtn').style.display = 'none';
    }
    deferredInstallPrompt = null;
  });
}

window.addEventListener('appinstalled', () => {
  document.getElementById('installBtn').style.display = 'none';
  deferredInstallPrompt = null;
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW error:', err));
  });
}
if (!userName) { openNameOverlay(); } else { maybeShowTutorial(); }

</script>
