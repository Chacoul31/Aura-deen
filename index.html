<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Aura_Deen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c10;  
    --bg-deep:   #131f4a;
    --surface:   rgba(24, 28, 32, .55);
    --surface2:  rgba(34, 40, 44, .5);
    --glass-blur: blur(20px) saturate(180%);
    --glass-highlight: inset 0 1px 0 rgba(255,255,255,.09);
    --border:    rgba(255,255,255,.14); 
    --border-strong: rgba(143,191,131,.5);
    --text:       #e8ebe4;  
    --muted:     #6d726c;
    --sub:       #a2a8a0;
    --accent:    #8fbf83;
    --accent2:   #e8b84b;
    --accent3: #3d5a80;
--accent3-glow: rgba(61,90,128,.35);
    --user-bub:  #223244;
    --user-text: #e2eef5;
    --bot-bub:   #171b1f;  
    --radius-lg: 24px;   /* était 20px */
    --radius-md: 18px;   /* était 14px */
    --radius-sm: 12px;   /* était 9px */;
    --font-display: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --font:      'Inter', -apple-system, 'Segoe UI', sans-serif;
    --font-ar:   'Amiri', serif;
    --ease-out:  cubic-bezier(.16,1,.3,1);
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --shadow: 0 10px 34px -10px rgba(0,0,0,.4), 0 2px 10px -3px rgba(0,0,0,.28);
    --shadow-sm: 0 2px 10px -3px rgba(0,0,0,.4);
  }

  /* ===== Glassmorphism global ===== */
  .bubble.bot, .verse-card, .menu-panel, .theme-menu, .name-card, .tuto-card, .stat-box,
  .audiobar, .input-wrap, .tool-btn, .chip, .quick-link, .topbar-icon, .drawer, .result-card,
  .theme-menu-item, .sourate-item, .welcome-logo {
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
  }
  .bubble.bot, .verse-card, .menu-panel, .theme-menu, .name-card, .tuto-card, .stat-box, .audiobar, .input-wrap {
    box-shadow: var(--glass-highlight), var(--shadow-sm);
  }
  .tool-btn, .chip, .quick-link, .topbar-icon {
    transition: transform .18s var(--ease-spring), border-color .25s var(--ease-out), background .25s var(--ease-out), box-shadow .25s var(--ease-out) !important;
  }
  .tool-btn:active, .chip:active, .quick-link:active, .topbar-icon:active, .send-btn:active, .verse-play:active {
    transform: scale(.92) !important;
  }
  .send-btn.active {
    box-shadow: 0 4px 18px -4px rgba(143,191,131,.55), var(--glass-highlight);
  }
  .verse-card:hover, .quick-link:hover {
    box-shadow: var(--glass-highlight), 0 8px 24px -8px rgba(0,0,0,.35);
  }
  html, body { height: 100%; height: 100dvh; background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 45%, #0a1024 78%, var(--bg-deep) 100%); color: var(--text); font-family: var(--font); overflow: hidden; }
  ::selection { background: rgba(143,191,131,.28); color: var(--text); }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 760px; margin: 0 auto; position: relative; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 58px; flex-shrink: 0;
    background: linear-gradient(to bottom, var(--bg) 65%, transparent); backdrop-filter: blur(6px); position: relative; z-index: 10; }
  .topbar-icon { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
    border: 1px solid var(--border); color: var(--sub); cursor: pointer; background: var(--surface);
    transition: border-color .3s var(--ease-out), color .3s var(--ease-out), background .3s var(--ease-out), transform .35s var(--ease-spring); }
  .topbar-icon svg { width: 15px; height: 15px; }
  .topbar-icon:hover { border-color: var(--accent); color: var(--text); background: var(--surface2); transform: translateY(-1px); }
  .topbar-title { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: .6px; }
  .topbar-title .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 6px var(--accent2); animation: pulseDot 2.4s ease-in-out infinite; }
  @keyframes pulseDot { 0%,100%{opacity:.85; transform:scale(1)} 50%{opacity:.4; transform:scale(.85)} }
  .meander { height: 1px; flex-shrink: 0; opacity: .5; background-image: repeating-linear-gradient(90deg, var(--border-strong) 0 2px, transparent 2px 14px); }
  .topbar-icon.accent3-active { border-color: var(--accent3); color: #a8c2e0; background: rgba(61,90,128,.12); }
  .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease-out); z-index: 30; }
  .menu-overlay.open { opacity: 1; pointer-events: auto; }
  .menu-panel { position: fixed; top: 0; left: 0; bottom: 0; width: 300px; max-width: 86vw; background: var(--surface); border-right: 1px solid var(--border);
    box-shadow: var(--shadow); transform: translateX(-100%); transition: transform .38s var(--ease-out); z-index: 31; display: flex; flex-direction: column; padding: 16px; }
  .menu-panel.open { transform: translateX(0); }
  .menu-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-family: var(--font-display); font-size: 15px; }
  .menu-close { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--sub);
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .25s var(--ease-out); }
  .menu-close:hover { border-color: var(--accent); color: var(--text); transform: rotate(90deg); }
  .menu-close svg { width: 13px; height: 13px; }
  .menu-search { width: 100%; padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); font-size: 13px; margin-bottom: 10px; font-family: var(--font); }
  .menu-search:focus { outline: none; border-color: var(--accent); }
  .menu-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .sourate-item { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: var(--radius-sm); cursor: pointer; transition: background .18s var(--ease-out); }
  .sourate-item:hover { background: var(--surface2); }
  .s-num { font-family: var(--font-display); font-size: 11px; color: var(--muted); width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .s-meta { flex: 1; min-width: 0; }
  .s-meta .translit { font-size: 13.5px; color: var(--text); }
  .s-meta .translation { font-size: 11px; color: var(--muted); }
  .s-arabic { font-family: var(--font-ar); font-size: 16px; color: var(--accent2); }

  .chat { flex: 1; overflow-y: auto; padding: 18px 20px 8px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
  .chat::-webkit-scrollbar { width: 5px; }
  .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 58vh; text-align: center; gap: 10px; animation: fadeUp .5s var(--ease-out); }
  .welcome-logo { width: 60px; height: 60px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center; margin-bottom: 10px; box-shadow: 0 0 36px rgba(143,191,131,.14);
    animation: glow 4s ease-in-out infinite, float 5s ease-in-out infinite; }
  .welcome-logo svg { width: 30px; height: 30px; }
  @keyframes glow { 0%,100%{box-shadow:0 0 30px rgba(143,191,131,.12)} 50%{box-shadow:0 0 46px rgba(232,184,75,.22)} }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .welcome h1 { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
  .welcome p { font-size: 13.5px; color: var(--sub); max-width: 320px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; max-width: 480px; }
  .chip { padding: 9px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--sub); font-size: 13px; cursor: pointer;
    transition: border-color .25s var(--ease-out), color .25s var(--ease-out), background .25s var(--ease-out), transform .25s var(--ease-spring); }
  .chip:hover { border-color: var(--accent); color: var(--text); background: var(--surface2); transform: translateY(-2px); }

  @keyframes fadeUp { from{opacity:0;transform:translateY(12px) scale(.985)} to{opacity:1;transform:translateY(0) scale(1)} }
  .msg-row { display: flex; gap: 10px; margin: 12px 0; animation: fadeUp .4s var(--ease-out); }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); font-size: 13px; font-weight: 600; }
  .avatar.user { background: var(--user-bub); color: var(--user-text); }
  .avatar.bot { background: var(--surface); }
  .avatar.bot svg { width: 17px; height: 17px; }
  .bubble { max-width: 78%; padding: 11px 14px; border-radius: var(--radius-md); font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .bubble.user { background: var(--user-bub); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bot-col { max-width: 88%; display: flex; flex-direction: column; gap: 8px; }
  .bubble.bot { background: var(--bot-bub); border-bottom-left-radius: 4px; border: 1px solid var(--border); }

  .typing { display: flex; gap: 4px; padding: 3px 2px; }
  .typing .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sub); animation: bounce 1.2s infinite; }
  .typing .dot:nth-child(2) { animation-delay: .15s; } .typing .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.5} 30%{transform:translateY(-4px);opacity:1} }

  .verse-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; background: rgba(255,255,255,.02); }
  .verse-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .verse-ref { font-size: 11px; color: var(--accent2); letter-spacing: .3px; }
  .verse-play { background: none; border: 1px solid var(--border); color: var(--sub); width: 26px; height: 26px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: .15s; flex-shrink: 0; }
  .verse-play:hover { border-color: var(--accent); color: var(--accent); }
  .verse-play svg { width: 11px; height: 11px; }
  .verse-ar { font-family: var(--font-ar); font-size: 21px; line-height: 1.9; text-align: right; direction: rtl; color: var(--text); }
  .verse-translit { font-size: 12.5px; font-style: italic; color: var(--muted); margin-top: 6px; }
  .verse-fr { font-size: 13.5px; margin-top: 5px; color: var(--sub); }
  .verse-link { font-size: 12px; color: var(--accent); cursor: pointer; margin-top: 4px; display: inline-block; }
  .verse-link:hover { text-decoration: underline; }

  .bottom { flex-shrink: 0; padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); position: relative; }
  .scroll-bottom-btn { position: absolute; right: 22px; top: -46px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); color: var(--sub); display: flex; align-items: center; justify-content: center; cursor: pointer;
    opacity: 0; pointer-events: none; transform: translateY(6px); transition: all .25s var(--ease-out); box-shadow: var(--shadow-sm); }
  .scroll-bottom-btn.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .scroll-bottom-btn svg { width: 15px; height: 15px; }
  .input-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 8px 8px 6px; transition: border-color .25s var(--ease-out); }
  .input-wrap:focus-within { border-color: var(--border-strong); }
  .input-row { display: flex; align-items: flex-end; gap: 8px; padding: 2px 6px; }
  #msg { flex: 1; resize: none; background: transparent; border: none; color: var(--text); font-family: var(--font); font-size: 14.5px;
    line-height: 1.4; max-height: 140px; padding: 8px 4px; }
  #msg:focus { outline: none; }
  #msg::placeholder { color: var(--muted); }
  .send-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--surface2); color: var(--muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all .25s var(--ease-out); }
  .send-btn svg { width: 16px; height: 16px; }
  .send-btn.active { background: var(--accent); color: #12140f; }
  .tools { display: flex; align-items: center; gap: 6px; padding: 4px 4px 2px; flex-wrap: wrap; }
  .tool-btn { display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 20px; border: 1px solid var(--border);
    background: transparent; color: var(--sub); font-size: 12px; cursor: pointer; transition: all .2s var(--ease-out); font-family: var(--font); position: relative; }
  .tool-btn svg { width: 12px; height: 12px; }
  .tool-btn:hover { border-color: var(--accent); color: var(--text); background: var(--surface2); }
  .tool-btn.active-menu { border-color: var(--accent2); color: var(--text); }
  .theme-menu { position: absolute; bottom: calc(100% + 10px); left: 0; width: min(280px, 86vw); background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius-md); box-shadow: var(--shadow); padding: 7px; z-index: 20;
    opacity: 0; transform: translateY(8px) scale(.97); pointer-events: none; transform-origin: bottom left;
    transition: opacity .22s var(--ease-out), transform .22s var(--ease-spring); }
  .theme-menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .theme-menu-item { display: block; width: 100%; text-align: left; padding: 8px 9px; border-radius: var(--radius-sm); border: none;
    background: transparent; color: var(--sub); font-size: 13px; font-family: var(--font); cursor: pointer; transition: background .18s var(--ease-out), color .18s var(--ease-out); }
  .theme-menu-item:hover { background: var(--surface2); color: var(--text); }
  .quiz-score { font-size: 11px; color: var(--accent2); margin-bottom: 6px; }
.quiz-question { font-size: 13.5px; margin-bottom: 6px; }
.quiz-verse { font-size: 14px; font-style: italic; color: var(--sub); margin-bottom: 10px; }
.quiz-options { display: flex; flex-wrap: wrap; gap: 8px; }
.quiz-option { padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 13px; cursor: pointer; transition: .2s; }
.quiz-option:hover:not(:disabled) { border-color: var(--accent); }
.quiz-option.correct { border-color: #7cc576; background: rgba(124,197,118,.15); color: #b7e8b0; }
.quiz-option.wrong { border-color: #e07a6a; background: rgba(224,122,106,.15); color: #f0a99c; }
.quiz-option:disabled { cursor: default; opacity: .8; }
  .model-badge { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; }

  .audiobar { position: fixed; left: 50%; transform: translateX(-50%) translateY(120%); bottom: 0; width: min(760px, 100%); background: var(--surface);
    border-top: 1px solid var(--border); padding: 9px 16px calc(9px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px;
    transition: transform .3s var(--ease-out); z-index: 25; }
  .audiobar.show { transform: translateX(-50%) translateY(0); }
  .audiobar .info { font-size: 11.5px; color: var(--sub); min-width: 120px; }
  .audiobar audio { flex: 1; height: 30px; }
  .install-banner { display: flex; align-items: center; gap: 10px; margin: 8px 14px 0; padding: 10px 10px 10px 12px;
    border-radius: var(--radius-md); border: 1px solid var(--border-strong); background: var(--surface);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); box-shadow: var(--glass-highlight), var(--shadow-sm);
    animation: fadeUp .4s var(--ease-out); }
  .install-banner-icon { width: 30px; height: 30px; border-radius: 50%; background: rgba(143,191,131,.15); color: var(--accent);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .install-banner-icon svg { width: 15px; height: 15px; }
  .install-banner-text { flex: 1; min-width: 0; }
  .install-banner-title { font-size: 13px; font-weight: 600; }
  .install-banner-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .install-banner-btn { background: var(--accent); color: #12140f; border: none; border-radius: 20px; padding: 8px 14px;
    font-size: 12.5px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .install-banner-close { width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent; color: var(--muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .install-banner-close svg { width: 13px; height: 13px; }

  #readerView { flex: 1; overflow-y: auto; padding: 18px 20px 90px; display: none; }
  #readerView.show { display: block; }
  #hadithView { flex: 1; overflow-y: auto; padding: 18px 20px 90px; display: none; }
  #hadithView.show { display: block; }
  #duaView { flex: 1; overflow-y: auto; padding: 18px 20px 90px; display: none; }
 #duaView.show { display: block; }
  #profileView { flex: 1; overflow-y: auto; padding: 18px 20px 90px; display: none; }
  #profileView.show { display: block; }
  #precheView { flex: 1; overflow-y: auto; padding: 18px 20px 90px; display: none; }
  #precheView.show { display: block; }
  .preche-chip.active { border-color: var(--accent2); color: var(--accent2); background: rgba(232,184,75,.1); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0; }
  .stat-box { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; text-align: center; background: rgba(255,255,255,.02); }
  .stat-box .stat-num { font-family: var(--font-display); font-size: 26px; color: var(--accent2); }
  .stat-box .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .4px; }
  .theme-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .theme-bar-label { font-size: 12.5px; color: var(--sub); width: 90px; flex-shrink: 0; }
  .theme-bar-track { flex: 1; height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
  .theme-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .reset-stats-btn { margin-top: 20px; width: 100%; padding: 11px; border-radius: var(--radius-md); border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; }
  .reset-stats-btn:hover { border-color: #e07a6a; color: #e07a6a; }
  #chatView.hide, .bottom.hide { display: none; }
  .sourate-header { text-align: center; margin-bottom: 26px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .sourate-header .ar-name { font-family: var(--font-ar); font-size: 32px; color: var(--accent2); }
  .sourate-header .translit-name { font-size: 14px; margin-top: 6px; }
  .sourate-header .sub { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
  .reader-controls { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .reader-verse { margin-bottom: 12px; }
  .reader-verse.playing .verse-card { border-color: var(--accent2); box-shadow: 0 0 0 1px rgba(232,184,75,.3), 0 0 20px rgba(232,184,75,.12); }

  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .glow { position: fixed; width: 460px; height: 460px; border-radius: 50%; pointer-events: none; filter: blur(100px); opacity: .16; z-index: 0;
    background: radial-gradient(circle, var(--accent2), transparent); top: 12%; left: 30%; transform: translateX(-50%); animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { from{transform:translate(-55%,0) scale(1)} to{transform:translate(-35%,4%) scale(1.2)} }
  .glow2 { position: fixed; width: 500px; height: 500px; border-radius: 50%; pointer-events: none; filter: blur(120px); opacity: .18; z-index: 0;
    background: radial-gradient(circle, var(--accent), transparent); bottom: -8%; right: 10%; transform: translateX(-50%); animation: drift2 12s ease-in-out infinite alternate; }
  @keyframes drift2 { from{transform:translate(-58%,0) scale(1)} to{transform:translate(-38%,-6%) scale(1.18)} }
  .glow3 { position: fixed; width: 420px; height: 420px; border-radius: 50%; pointer-events: none; filter: blur(115px); opacity: .15; z-index: 0;
    background: radial-gradient(circle, var(--accent3), transparent); top: 45%; left: 70%; transform: translateX(-50%); animation: drift3 15s ease-in-out infinite alternate; }
  @keyframes drift3 { from{transform:translate(-50%,0) scale(1)} to{transform:translate(-65%,-8%) scale(1.15)} }

  @media (prefers-reduced-motion: reduce) { *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  /* ── Name overlay ── */
